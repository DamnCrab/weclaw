services:
  weclaw:
    image: ghcr.io/fastclaw-ai/weclaw:latest
    container_name: weclaw
    restart: unless-stopped
    command: start
    volumes:
      - ${WECLAW_CONFIG_DIR:-./.weclaw}:/root/.weclaw
      - ${GEMINI_CONFIG_DIR:-./.gemini}:/root/.gemini
    environment:
      OPENCLAW_GATEWAY_URL: ${OPENCLAW_GATEWAY_URL:-}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_GATEWAY_PASSWORD: ${OPENCLAW_GATEWAY_PASSWORD:-}
